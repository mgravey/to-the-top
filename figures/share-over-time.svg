.today{stroke-width:1.2;opacity:.6} .dot{stroke:var(--bg);stroke-width:2}
.st{opacity:.13;transition:opacity .25s} .lab,.sub{display:none}
svg[data-hl="1"] .st1{opacity:1} svg[data-hl="1"] .st1 .lab,svg[data-hl="1"] .sub1{display:inline} svg[data-hl="1"] .st1 .l{stroke-width:3} svg[data-hl="2"] .st2{opacity:1} svg[data-hl="2"] .st2 .lab,svg[data-hl="2"] .sub2{display:inline} svg[data-hl="2"] .st2 .l{stroke-width:3} svg[data-hl="3"] .st3{opacity:1} svg[data-hl="3"] .st3 .lab,svg[data-hl="3"] .sub3{display:inline} svg[data-hl="3"] .st3 .l{stroke-width:3} svg[data-hl="4"] .st4{opacity:1} svg[data-hl="4"] .st4 .lab,svg[data-hl="4"] .sub4{display:inline} svg[data-hl="4"] .st4 .l{stroke-width:3} svg[data-hl="5"] .st5{opacity:1} svg[data-hl="5"] .st5 .lab,svg[data-hl="5"] .sub5{display:inline} svg[data-hl="5"] .st5 .l{stroke-width:3} 
