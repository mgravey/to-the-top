<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" data-steps="Matura,1st degree,Master,Doctorate,Professor" data-hl="1" role="img" aria-label="Girls' and boys' share among the people reaching each step from Matura to professorship, Austria 1960 to 2024, one step at a time">
<style>
