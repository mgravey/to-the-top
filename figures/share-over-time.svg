.gl{stroke:var(--bd);stroke-width:1} .par{stroke:var(--mu);stroke-width:1.2;stroke-dasharray:2 4}
.l{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round} .r{stroke-dasharray:5 5}
