<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" role="img" aria-label="Women's share among doctorates at their award year, the share they imply among new professors 15 years later, counted new professors from 2006 and professors in post, Austria 1980 to 2045, with a projection">
