name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test the timeline player
        run: node --test tests/

      - name: Regenerate the full text for language models
        run: python3 scripts/llms_full.py

      # Publish the page, its figures, the player script, and the files for search engines and LLMs.
      - name: Assemble site
        run: |
          mkdir -p _site/scripts
          cp index.html .nojekyll llms.txt llms-full.txt sitemap.xml _site/
          cp -r figures _site/
          cp scripts/parent_education_player.js _site/scripts/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
